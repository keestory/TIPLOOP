<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand }}{% endblock %} · {{ brand }}</title>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#FCFBF8">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ brand }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-name">{{ brand }}</span>
      <span class="brand-tag">{{ tagline }}</span>
    </a>
    <nav class="site-nav">
      {% if current_user %}
        <a href="/users/{{ current_user.id }}" class="nav-link nav-me">
          {% if current_user.avatar_url %}<img class="nav-avatar" src="{{ current_user.avatar_url }}" alt="">{% endif %}
          {{ current_user.name }}
        </a>
        <form action="/logout" method="post" class="inline-form">
          <button type="submit" class="nav-link as-button">로그아웃</button>
        </form>
      {% else %}
        <a href="/login" class="nav-link">로그인</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>{{ brand }} — 커머스·IT 실무자들의 팁·레퍼런스 커뮤니티</p>
  </footer>

  {% block fab %}
  <a class="fab" href="/posts/new">
    <span class="fab-icon">✏️</span><span class="fab-label">글쓰기</span>
  </a>
  {% endblock %}
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
