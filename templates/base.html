<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand }}{% endblock %} · {{ brand }}</title>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-name">{{ brand }}</span>
      <span class="brand-tag">교실을 넘어, 선생님을 잇다</span>
    </a>
    <nav class="site-nav">
      <a href="/posts/new" class="btn">글쓰기</a>
      {% if current_user %}
        <a href="/users/{{ current_user.id }}" class="nav-link">{{ current_user.name }} 선생님</a>
        <form action="/logout" method="post" class="inline-form">
          <button type="submit" class="nav-link as-button">로그아웃</button>
        </form>
      {% else %}
        <a href="/login" class="nav-link">로그인</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>{{ brand }} — 유치원·초·중·고 선생님들의 열린 커뮤니티</p>
  </footer>
</body>
</html>
