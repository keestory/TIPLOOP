<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ brand }}{% endblock %} · {{ brand }}</title>
  {# ── 공유 미리보기 (OG) — 화면별로 og 블록을 덮어쓸 수 있다 ── #}
  {% block og %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ brand }}">
  <meta property="og:title" content="{{ self.title() }} · {{ brand }}">
  <meta property="og:description" content="{{ tagline }}">
  <meta property="og:image" content="{{ site_url }}/static/og-default.png">
  <meta name="twitter:card" content="summary_large_image">
  {% endblock %}
  {# 폰트는 CSS @import(직렬 로딩) 대신 head의 병렬 link로 — preconnect로 TLS 선연결 #}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/tipping.css">
  {# ── PWA (홈 화면 설치) ── #}
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#FCFBF8">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{ brand }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app">
    {% block app %}{% endblock %}
  </div>
  {% block script %}{% endblock %}
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
