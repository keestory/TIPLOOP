{% extends "base.html" %}
{% block title %}로그인 중{% endblock %}
{% block fab %}{% endblock %}
{% block content %}

<div class="auth">
  <p class="auth-sub" id="msg">로그인 중입니다…</p>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
  const sb = createClient("{{ supabase_url }}", "{{ supabase_anon_key }}")
  const msg = document.getElementById('msg')

  async function finish() {
    const { data } = await sb.auth.getSession()
    const session = data.session
    if (!session) {
      msg.textContent = '로그인 정보를 찾지 못했습니다. 다시 시도해 주세요.'
      return
    }
    const body = new URLSearchParams()
    body.set('access_token', session.access_token)
    const res = await fetch('/auth/session', { method: 'POST', body })
    if (!res.ok) {
      msg.textContent = '세션 생성에 실패했습니다. 다시 시도해 주세요.'
      return
    }
    const j = await res.json()
    location.replace(j.next || '/')
  }
  finish()
</script>
{% endblock %}
