{% extends "base.html" %}
{% block title %}글쓰기{% endblock %}
{% block fab %}{% endblock %}
{% block content %}

<h1 class="page-title">글쓰기</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form class="form" method="post" action="/posts" id="post-form">
  <label for="category">카테고리</label>
  <select id="category" name="category" required onchange="toggleLink(this.value)">
    {% for code, label in categories.items() %}
      <option value="{{ code }}"
        {% if (form and form.category == code) or (not form and prefill_category == code) %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>

  <label for="title">제목</label>
  <input id="title" name="title" type="text" required value="{{ form.title if form else '' }}">

  <label for="body">내용</label>
  <textarea id="body" name="body" rows="10" required>{{ form.body if form else '' }}</textarea>

  <div id="link-field" class="link-field">
    <label for="link_url">참고 링크 <span class="hint">(레퍼런스일 때, 선택)</span></label>
    <input id="link_url" name="link_url" type="url" placeholder="https://..."
           value="{{ form.link_url if form else '' }}">
  </div>

  {% if supabase_url %}
  <label>이미지 <span class="hint">(사진에 표시하며 설명, 선택)</span></label>
  <div class="anno">
    <label class="btn btn-small anno-pick">
      이미지 추가<input id="imgpick" type="file" accept="image/*" hidden>
    </label>
    <div id="anno-editor" class="anno-editor" hidden>
      <div class="anno-tools">
        <button type="button" class="anno-tool is-active" data-tool="pen">✏️ 펜</button>
        <button type="button" class="anno-tool" data-tool="arrow">➘ 화살표</button>
        <button type="button" class="anno-tool" data-tool="rect">▭ 사각형</button>
        <button type="button" class="anno-tool" data-tool="highlighter">🖍 형광</button>
        <span class="anno-colors">
          <button type="button" class="anno-color is-active" data-color="#c8ff00" style="background:#c8ff00"></button>
          <button type="button" class="anno-color" data-color="#e5484d" style="background:#e5484d"></button>
          <button type="button" class="anno-color" data-color="#0b0b0c" style="background:#0b0b0c"></button>
          <button type="button" class="anno-color" data-color="#ffffff" style="background:#fff;border:1px solid #ddd"></button>
        </span>
        <button type="button" class="anno-op" id="anno-undo">되돌리기</button>
        <button type="button" class="anno-op" id="anno-clear">표시 지우기</button>
        <button type="button" class="anno-op" id="anno-remove">이미지 제거</button>
      </div>
      <canvas id="anno-canvas" class="anno-canvas"></canvas>
    </div>
  </div>
  <input type="hidden" id="image_url" name="image_url" value="{{ form.image_url if form else '' }}">

  <label>영상 <span class="hint">(재생 중 특정 지점에 코멘트를 달 수 있어요, 선택)</span></label>
  <div class="video-pick">
    <label class="btn btn-small">영상 추가<input id="vidpick" type="file" accept="video/*" hidden></label>
    <span id="vidname" class="hint"></span>
    <button type="button" class="anno-op" id="vid-remove" hidden>제거</button>
  </div>
  <input type="hidden" id="video_url" name="video_url" value="{{ form.video_url if form else '' }}">
  {% endif %}

  <button type="submit" class="btn" id="submit-btn">올리기</button>
</form>

<script>
  function toggleLink(value) {
    document.getElementById('link-field').style.display = value === 'reference' ? 'block' : 'none';
  }
  toggleLink(document.getElementById('category').value);
</script>

{% if supabase_url %}
<script src="/static/annotate.js"></script>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
  const supabase = createClient("{{ supabase_url }}", "{{ supabase_anon_key }}")

  const anno = new Annotator(document.getElementById('anno-canvas'))
  const editor = document.getElementById('anno-editor')
  const imageUrlInput = document.getElementById('image_url')
  const videoUrlInput = document.getElementById('video_url')
  const form = document.getElementById('post-form')
  const submitBtn = document.getElementById('submit-btn')
  let videoFile = null

  document.getElementById('imgpick').addEventListener('change', (e) => {
    const file = e.target.files[0]
    if (!file) return
    const img = new Image()
    img.onload = () => { anno.setImage(img); editor.hidden = false; imageUrlInput.value = '' }
    img.src = URL.createObjectURL(file)
  })
  document.querySelectorAll('.anno-tool').forEach((b) =>
    b.addEventListener('click', () => {
      document.querySelectorAll('.anno-tool').forEach((x) => x.classList.remove('is-active'))
      b.classList.add('is-active'); anno.setTool(b.dataset.tool)
    }))
  document.querySelectorAll('.anno-color').forEach((b) =>
    b.addEventListener('click', () => {
      document.querySelectorAll('.anno-color').forEach((x) => x.classList.remove('is-active'))
      b.classList.add('is-active'); anno.setColor(b.dataset.color)
    }))
  document.getElementById('anno-undo').addEventListener('click', () => anno.undo())
  document.getElementById('anno-clear').addEventListener('click', () => anno.clearMarks())
  document.getElementById('anno-remove').addEventListener('click', () => {
    anno.reset(); editor.hidden = true; imageUrlInput.value = ''; document.getElementById('imgpick').value = ''
  })

  const vidRemove = document.getElementById('vid-remove')
  document.getElementById('vidpick').addEventListener('change', (e) => {
    videoFile = e.target.files[0] || null
    document.getElementById('vidname').textContent = videoFile ? videoFile.name : ''
    vidRemove.hidden = !videoFile
    videoUrlInput.value = ''
  })
  vidRemove.addEventListener('click', () => {
    videoFile = null; document.getElementById('vidpick').value = ''
    document.getElementById('vidname').textContent = ''; vidRemove.hidden = true; videoUrlInput.value = ''
  })

  async function uploadFile(file, ext, type) {
    const { data: u } = await supabase.auth.getUser()
    const uid = u && u.user ? u.user.id : 'anon'
    const path = `${uid}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`
    const { data, error } = await supabase.storage.from('attachments')
      .upload(path, file, { contentType: type, upsert: false })
    if (error) throw error
    return supabase.storage.from('attachments').getPublicUrl(data.path).data.publicUrl
  }
  const canvasBlob = () => new Promise((res) => anno.toBlob(res))

  form.addEventListener('submit', (e) => {
    const needImage = anno.hasImage() && !imageUrlInput.value
    const needVideo = videoFile && !videoUrlInput.value
    if (!needImage && !needVideo) return
    e.preventDefault()
    submitBtn.disabled = true; submitBtn.textContent = '업로드 중…'
    ;(async () => {
      try {
        if (needImage) imageUrlInput.value = await uploadFile(await canvasBlob(), 'png', 'image/png')
        if (needVideo) {
          const ext = (videoFile.name.split('.').pop() || 'mp4').toLowerCase()
          videoUrlInput.value = await uploadFile(videoFile, ext, videoFile.type || 'video/mp4')
        }
        form.submit()
      } catch (err) {
        alert('업로드 실패: ' + (err.message || err) + '\n(Supabase Storage에 attachments 버킷이 있는지 확인)')
        submitBtn.disabled = false; submitBtn.textContent = '올리기'
      }
    })()
  })
</script>
{% endif %}
{% endblock %}
