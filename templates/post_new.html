{% extends "base.html" %}
{% block title %}글쓰기{% endblock %}
{% block fab %}{% endblock %}
{% block content %}

<h1 class="page-title">글쓰기</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form class="form" method="post" action="/posts">
  <label for="category">카테고리</label>
  <select id="category" name="category" required onchange="toggleLink(this.value)">
    {% for code, label in categories.items() %}
      <option value="{{ code }}"
        {% if (form and form.category == code) or (not form and prefill_category == code) %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>

  <label for="title">제목</label>
  <input id="title" name="title" type="text" required value="{{ form.title if form else '' }}">

  <label for="body">내용</label>
  <textarea id="body" name="body" rows="10" required>{{ form.body if form else '' }}</textarea>

  <div id="link-field" class="link-field">
    <label for="link_url">참고 링크 <span class="hint">(레퍼런스일 때, 선택)</span></label>
    <input id="link_url" name="link_url" type="url" placeholder="https://..."
           value="{{ form.link_url if form else '' }}">
  </div>

  <button type="submit" class="btn">올리기</button>
</form>

<script>
  function toggleLink(value) {
    document.getElementById('link-field').style.display = value === 'reference' ? 'block' : 'none';
  }
  toggleLink(document.getElementById('category').value);
</script>
{% endblock %}
