<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FCFBF8">
  <title>TIPLOOP · 연결 확인</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #FCFBF8; color: #1A1917; }
    body { display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    main { width: min(420px, 100%); padding: 28px; border: 1px solid #E4DED2; border-radius: 24px; background: #FFF; box-shadow: 0 20px 60px rgba(26, 25, 23, .08); }
    .brand { margin: 0 0 42px; font-size: 22px; font-weight: 900; letter-spacing: -.04em; }
    .brand::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 3px; border-radius: 50%; background: #CDFF47; }
    h1 { margin: 0; font-size: 27px; line-height: 1.25; letter-spacing: -.04em; }
    p { margin: 12px 0 24px; color: #6C665D; font-size: 15px; line-height: 1.6; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 15px; background: #CDFF47; color: #1A1917; font: 800 16px inherit; }
  </style>
</head>
<body>
  <main>
    <p class="brand">TIPLOOP</p>
    <h1>인터넷 연결을<br>확인해 주세요.</h1>
    <p>연결이 돌아오면 다시 시도할 수 있어요. 작성 중인 내용은 앱을 닫기 전에 확인해 주세요.</p>
    <button type="button" onclick="location.replace('https://tiploop.vercel.app')">다시 연결하기</button>
  </main>
</body>
</html>
